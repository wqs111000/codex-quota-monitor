<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#070b16"><link rel="manifest" href="manifest.webmanifest"><title>CODEX QUOTA // MONITOR</title><link rel="stylesheet" href="style.css?v=quota-ui2"><link rel="stylesheet" href="chart-axis.css?v=calendar1"></head>
<body><div class="noise"></div><main class="shell">
  <header class="topbar"><div class="brand"><span class="brand-mark">◈</span><div><span class="eyebrow">PERSONAL TELEMETRY</span><h1>CODEX QUOTA</h1></div></div><div class="live"><span class="live-dot"></span><span id="last-sync">WAITING FOR SIGNAL</span><button id="notify-toggle" class="notify-button" type="button" title="开启重置通知">通知</button><button id="refresh" class="icon-button" title="立即采集">↻</button></div></header>
  <section id="notice" class="notice hidden"></section>
  <section id="cards" class="cards" aria-label="当前额度"></section>
  <section class="panel chart-panel"><div class="panel-head"><div><span class="eyebrow">UTILIZATION STREAM</span><h2>额度变化曲线</h2></div><div class="range"><button data-range="24" class="active">24H</button><button data-range="168">7D</button><button data-range="720">30D</button></div></div><div id="chart-legend" class="legend"></div><div class="chart-wrap"><svg id="chart" viewBox="0 0 1000 390" preserveAspectRatio="none" aria-label="额度变化曲线" aria-describedby="chart-time-summary chart-time-scale chart-time-zone"></svg><div id="chart-pinned-overlays"></div><div id="chart-tooltip" class="chart-tooltip" role="status" aria-live="polite"></div></div><div id="chart-time-axis" class="chart-time-axis"></div><div class="chart-time-caption"><span id="chart-time-summary"></span><span class="chart-time-details"><span id="chart-time-scale"></span><span id="chart-time-zone"></span></span></div><div id="chart-pins" class="chart-pins" aria-live="polite"></div></section>
  <footer><span>LOCAL ONLY · OAuth token never leaves the collector</span><span id="data-location"></span></footer>
</main><script src="chart-axis.js?v=calendar1"></script><script src="app.js?v=quota-ui2"></script></body></html>
