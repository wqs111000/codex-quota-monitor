<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CODEX QUOTA // MONITOR</title><link rel="stylesheet" href="style.css"></head>
<body><div class="noise"></div><main class="shell">
  <header class="topbar"><div class="brand"><span class="brand-mark">◈</span><div><span class="eyebrow">PERSONAL TELEMETRY</span><h1>CODEX QUOTA</h1></div></div><div class="live"><span class="live-dot"></span><span id="last-sync">WAITING FOR SIGNAL</span><button id="refresh" class="icon-button" title="立即采集">↻</button></div></header>
  <section id="notice" class="notice hidden"></section>
  <section class="dashboard-top"><section id="cards" class="cards"></section><div class="top-side">
    <div class="panel forecast-panel"><div class="panel-head"><div><span class="eyebrow">RESET FORECAST</span><h2>重置预测</h2></div><span id="forecast-badge" class="badge muted">NO SIGNAL</span></div><div id="forecast-content"></div><form id="forecast-form" class="forecast-form"><label>预计重置时间<input id="forecast-reset-at" type="datetime-local" required></label><label>未来 24 小时概率<input id="forecast-probability" type="number" min="0" max="100" step="1" placeholder="例如 75" required></label><div class="forecast-actions"><button type="submit">保存预测</button><button id="clear-forecast" type="button" class="ghost-button">清除</button><span id="forecast-form-status"></span></div></form></div>
  </div></section>
  <section class="panel chart-panel"><div class="panel-head"><div><span class="eyebrow">UTILIZATION STREAM</span><h2>额度变化曲线</h2></div><div class="range"><button data-range="24" class="active">24H</button><button data-range="168">7D</button><button data-range="720">30D</button></div></div><div id="chart-legend" class="legend"></div><div class="chart-wrap"><svg id="chart" viewBox="0 0 1000 390" preserveAspectRatio="none" aria-label="额度变化曲线"></svg><div id="chart-tooltip" class="chart-tooltip" role="status" aria-live="polite"></div></div></section>
  <footer><span>LOCAL ONLY · OAuth token never leaves the collector</span><span id="data-location"></span></footer>
</main><script src="app.js"></script></body></html>
