<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CODEX QUOTA // MONITOR</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="noise"></div><main class="shell">
  <header class="topbar"><div class="brand"><span class="brand-mark">◈</span><div><span class="eyebrow">PERSONAL TELEMETRY</span><h1>CODEX QUOTA</h1></div></div><div class="live"><span class="live-dot"></span><span id="last-sync">WAITING FOR SIGNAL</span><button id="refresh" class="icon-button" title="立即采集">↻</button></div></header>
  <section id="notice" class="notice hidden"></section>
  <section class="dashboard-top"><section id="cards" class="cards"></section><div class="top-side">
    <div class="panel forecast-panel"><div class="panel-head"><div><span class="eyebrow">RESET FORECAST</span><h2>重置预测</h2></div><span id="forecast-badge" class="badge muted">NO SIGNAL</span></div><div id="forecast-content"></div></div>
  </div></section>
  <section class="panel chart-panel"><div class="panel-head"><div><span class="eyebrow">UTILIZATION STREAM</span><h2>额度变化曲线</h2></div><div class="range"><button data-range="24" class="active">24H</button><button data-range="168">7D</button><button data-range="720">30D</button></div></div><div class="legend"><span><i class="legend-dot cyan"></i>5 小时</span><span><i class="legend-dot violet"></i>周期额度</span><span><i class="legend-line"></i>推荐节奏</span></div><div class="chart-wrap"><svg id="chart" viewBox="0 0 1000 390" preserveAspectRatio="none" aria-label="额度变化曲线"></svg></div></section>
  <footer><span>LOCAL ONLY · OAuth token never leaves the collector</span><span id="data-location"></span></footer>
</main><script src="/app.js"></script></body></html>
